<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能食谱查找器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" data-page="home">
                <i class="bi bi-egg-fried me-2"></i>智能食谱查找器
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-page="search"><i class="bi bi-search"></i> 查找菜谱</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="weekly"><i class="bi bi-calendar-week"></i> 周计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="rate"><i class="bi bi-star"></i> 评分</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-page="favorites"><i class="bi bi-heart"></i> 收藏夹</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4" id="app">
        <!-- Dynamic content loaded by JS -->
    </main>

    <!-- Recipe Detail Modal -->
    <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content" id="recipeModalContent">
                <!-- Dynamic content loaded by JS -->
            </div>
        </div>
    </div>

    <!-- Loading Spinner Overlay -->
    <div id="loadingOverlay" class="d-none">
        <div class="spinner-overlay">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-3 text-secondary">搜索中...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
